[package]
name = "bci-workshop-hub"
version = "0.1.6"
description = "Cross-platform onboarding and daily classroom hub for BIU BCI Workshop 2026"
authors = ["Dr. Uri Korisky"]
edition = "2021"

[lib]
name = "bci_workshop_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
rand = "0.8"
urlencoding = "2.1"
sysinfo = "0.33"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
